name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: format · lint · types · tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails on known high/critical CVEs in shipped dependencies; the pnpm
      # overrides in pnpm-workspace.yaml keep transitive pins patched.
      - name: Audit dependencies (pnpm audit)
        run: pnpm audit --prod --audit-level high

      - name: Check formatting (oxfmt)
        run: pnpm format:check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Type-check (tsc)
        run: pnpm typecheck

      - name: Test (vitest)
        run: pnpm test

  secrets-scan:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — the scan covers every commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

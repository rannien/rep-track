# Build-script decisions for dependencies that ship postinstall scripts.
# Declining also stops pnpm v11 from failing every `pnpm <script>` with
# ERR_PNPM_IGNORED_BUILDS.
#   esbuild — vitest's bundler; its install script places the platform binary
#   sharp   — not needed: next.config.mjs sets images.unoptimized: true
#   msw     — @vitest/mocker's optional dep; its postinstall only prints a
#             support banner and we never run msw itself
allowBuilds:
  esbuild: true
  sharp: false
  msw: false

# next and the dev toolchain pin vulnerable transitive versions; force the
# patched releases everywhere so `pnpm audit` (prod and dev) stays clean.
#   postcss >=8.5.25 — GHSA-fxqj-rqcc-2cmp line (source-map file reads) + XSS
#   sharp   >=0.35.5 — inherited libvips/libheif/librsvg CVEs (unused here, but still resolved)
#   source-map-js >=1.2.2 — GHSA-68fv-2mgg-jv7q (event-loop DoS), via postcss
#   baseline-browser-mapping >=2.11.0 — GHSA-w5vr-8v7q-w6rv (process termination)
#   tinypool >=2.1.2 — GHSA-85c8-ppgw-ccpr line (prototype pollution → RCE), via oxfmt
#   vite ^7.3.7 — GHSA-587h-7wmj-h5pm line (dev-server file reads), via vitest
overrides:
  postcss: ">=8.5.25"
  sharp: ">=0.35.5"
  source-map-js: ">=1.2.2"
  baseline-browser-mapping: ">=2.11.0"
  tinypool: ">=2.1.2"
  vite: "^7.3.7"
